name: AGC oracle

# The Apollo Guidance Computer's golden model (src/agc/iss.ts, Appendix F) against yaAGC, Virtual AGC's emulator, in
# lock step: directed programs and seeded random ones, every instruction's registers, erasable memory and memory cycles
# (scripts/agc/oracle.ts, docs/VERIFICATION.md). yaAGC (GPLv2) is fetched here at a pinned revision and compiled with
# our harness (scripts/agc/harness.c); it is never kept in this repository. Not a deploy gate. Failures (the program
# and the first difference) are kept as an artifact.
on:
  push:
    paths:
      - 'src/agc/**'
      - 'scripts/agc/**'
      - '.github/workflows/agc-oracle.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Seed range, e.g. 1000..3000 (empty: 1..500, or a new range on the weekly run)'
        required: false

permissions:
  contents: read

env:
  VIRTUALAGC_REV: 3351d115a94383db24d27aa425aba11b6fbf60b2

jobs:
  agc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fetch yaAGC's engine
        run: |
          git init /tmp/virtualagc && cd /tmp/virtualagc
          git remote add origin https://github.com/virtualagc/virtualagc
          git fetch --depth 1 origin "$VIRTUALAGC_REV"
          git checkout FETCH_HEAD -- yaAGC/agc_engine.c yaAGC/agc_engine.h yaAGC/yaAGC.h
      - name: Build the harness
        run: gcc -O2 -w -I /tmp/virtualagc/yaAGC scripts/agc/harness.c /tmp/virtualagc/yaAGC/agc_engine.c -o /tmp/agc-harness -lm
      - run: npm ci
      - name: Compare
        env:
          SEEDS: ${{ inputs.seeds }}
          RUN: ${{ github.run_number }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$SEEDS" ]; then
            if [ "$EVENT" = schedule ]; then FROM=$((1000 + 2000 * RUN)); SEEDS="$FROM..$((FROM + 1999))"; else SEEDS="1..500"; fi
          fi
          echo "seeds $SEEDS"
          npx vite-node scripts/agc/oracle.ts --harness /tmp/agc-harness --seeds "$SEEDS" --out agc-report
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agc-report
          path: agc-report
          if-no-files-found: ignore
