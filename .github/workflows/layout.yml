name: Chip layout (Yosys + OpenROAD, sky130)

# Exports the dual-core as Verilog from the site's own netlists, runs the open-source RTL-to-GDS
# flow (OpenROAD-flow-scripts, SkyWater 130 nm), and publishes the layout, tiles and reports as the
# release "layout-latest", which the Pages deploy copies into the site.
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/layout/**'
      - 'scripts/export-layout.ts'
      - 'src/sim/vexport.ts'
      - '.github/workflows/layout.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: layout-${{ github.ref }}
  cancel-in-progress: true

env:
  ORFS_IMAGE: openroad/orfs:26Q4-57-g8b1b51d33

jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export Verilog from the netlists
        run: npx vite-node scripts/export-layout.ts layout/design
      - name: Free disk space for the flow image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: Run OpenROAD-flow-scripts
        run: |
          docker pull "$ORFS_IMAGE"
          docker run --rm -e WORK=/work -v "$GITHUB_WORKSPACE:/work" "$ORFS_IMAGE" bash /work/scripts/layout/run-flow.sh
      - name: Summarize
        if: always()
        run: |
          sudo chown -R "$(id -u)" layout || true
          node scripts/layout/summarize.mjs layout/out layout/site
          if [ -d layout/out/tiles ]; then cp -r layout/out/tiles layout/site/tiles; fi
          mkdir -p layout/site/reports
          cp -r layout/out/reports/* layout/site/reports/ 2>/dev/null || true
          cp layout/design/mosfet_riscv.v layout/site/ || true
          tar -czf layout.tar.gz -C layout/site .
          tar -czf layout-logs.tar.gz -C layout out/flow.log out/logs out/reports out/run.json 2>/dev/null || tar -czf layout-logs.tar.gz -C layout out/flow.log || true
          ls -la layout.tar.gz layout-logs.tar.gz || true
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-logs
          path: layout-logs.tar.gz
          if-no-files-found: ignore
      - name: Publish the layout
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete layout-latest --yes --cleanup-tag || true
          gh release create layout-latest layout.tar.gz layout-logs.tar.gz --target "$GITHUB_SHA" \
            --title "Chip layout (sky130hd)" --notes "Generated by the layout workflow from $GITHUB_SHA ($GITHUB_REF_NAME)." --prerelease
      - name: Redeploy the site with the new layout
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
