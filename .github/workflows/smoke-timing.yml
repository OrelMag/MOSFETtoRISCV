# Temporary: measures the smoke step on a GitHub runner (removed in the next commit).
name: Smoke timing
on:
  push:
    branches: [test/smoke]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke
