name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the full history: the build number in the version is the commit count
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Add the chip layout (published by the layout workflow, if any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/layout
          if gh release download layout-latest -p layout.tar.gz -D /tmp --repo "$GITHUB_REPOSITORY"; then
            tar -xzf /tmp/layout.tar.gz -C dist/layout && ls dist/layout
          else
            echo "no layout published yet"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  # The exported Verilog, synthesized by Yosys and simulated, must match our own simulation of the
  # dual-core on every multi-core program: a change that breaks the exported hardware does not deploy.
  verify-hdl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install yowasp-yosys
      - run: npx vite-node scripts/verify-export.ts all
  deploy:
    needs: [build, verify-hdl]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
