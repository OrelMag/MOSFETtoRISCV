name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', '.claude/**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # a merge every 20 minutes would cancel every 25-minute run: nothing would ever deploy. One runs, the newest waits.

jobs:
  # What the Yosys jobs have to check. Measured from the last successful deploy, not the previous push: a push
  # cancels the run before it (concurrency above), and that run's changes must not go unchecked. By hand: all.
  changes:
    runs-on: ubuntu-latest
    outputs:
      hdl: ${{ steps.diff.outputs.hdl }}
      fpga: ${{ steps.diff.outputs.fpga }}
      tests: ${{ steps.tested.outputs.tests }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh run list --workflow deploy.yml --branch main --status success --limit 1 --json headSha -q '.[0].headSha' --repo "$GITHUB_REPOSITORY" || true)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$base" ] && files=$(git diff --name-only "$base" HEAD); then
            core='^(src/sim/|src/riscv/|src/lib/|package-lock\.json|\.github/workflows/deploy\.yml)'
            echo "$files" | grep -qE "$core|^scripts/verify-export" && echo hdl=true >> "$GITHUB_OUTPUT" || echo hdl=false >> "$GITHUB_OUTPUT"
            echo "$files" | grep -qE "$core|^src/editor/|^scripts/fpga-" && echo fpga=true >> "$GITHUB_OUTPUT" || echo fpga=false >> "$GITHUB_OUTPUT"
          else
            echo hdl=true >> "$GITHUB_OUTPUT"
            echo fpga=true >> "$GITHUB_OUTPUT"
          fi
      # The unit tests are skipped when this exact tree already passed the full gate (gate.yml) on its integ branch:
      # a batch merged onto an unmoved main has the integ head's tree. Also when everything since the last successful
      # deploy is text that no test reads (docs, licence, the CNAME). By hand: always tested. Build + smoke always run.
      - id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tests=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tree=$(git rev-parse 'HEAD^{tree}')
            for sha in $(gh run list --workflow gate.yml --status success --limit 40 --json headSha -q '.[].headSha' --repo "$GITHUB_REPOSITORY" || true); do
              t=$(git rev-parse "$sha^{tree}" 2>/dev/null || gh api "repos/$GITHUB_REPOSITORY/commits/$sha" -q .commit.tree.sha 2>/dev/null || true)
              if [ "$t" = "$tree" ]; then echo "tree $tree passed gate.yml at $sha: unit tests skipped"; tests=false; break; fi
            done
            base=$(gh run list --workflow deploy.yml --branch main --status success --limit 1 --json headSha -q '.[0].headSha' --repo "$GITHUB_REPOSITORY" || true)
            if [ "$tests" = true ] && [ -n "$base" ] && files=$(git diff --name-only "$base" HEAD) && [ -n "$files" ] &&
               ! echo "$files" | grep -qvE '^(docs/|\.claude/|LICENSE$|public/CNAME$)|\.md$'; then
              echo "only text changed since $base: unit tests skipped"; tests=false
            fi
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
  # The unit tests (45-80 min on a runner, 2026-11) run beside the build and its smoke test (~5 + ~67 min), not before them.
  test:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: "Cache Freedoom (scripts/doom/fetch-wad.mjs, pinned sha256)"
        uses: actions/cache@v5
        with:
          path: .cache/doom
          key: freedoom-0.13.0
      - run: node scripts/doom/fetch-wad.mjs
      - run: npm test
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the full history: the build number in the version is the commit count
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: "Cache Freedoom (scripts/doom/fetch-wad.mjs, pinned sha256)"
        uses: actions/cache@v5
        with:
          path: .cache/doom
          key: freedoom-0.13.0
      - name: Add Freedoom (Appendix B's game data, BSD licence; public/doom/, never checked in)
        run: node scripts/doom/fetch-wad.mjs --public
      - run: npm run build
      # skipped only when no layout was ever published; any other failure stops the deploy (scripts/ci/fetch-layout.sh)
      - name: Add the chip layout (published by the layout workflow)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/fetch-layout.sh dist/layout
      # Every route of the built site in headless Chrome (preinstalled on the runner): a runtime error,
      # a failed request or a page wider than the window does not deploy.
      - name: Smoke test
        run: npm run smoke
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  # The exported Verilog, synthesized by Yosys and simulated, must match our own simulation of the
  # dual-core and the system CPUs on their programs: a change that breaks the exported hardware does not
  # deploy. One job per design, in parallel (each 4-9 min), so the deploy waits no longer than the build.
  verify-hdl:
    needs: changes
    if: needs.changes.outputs.hdl == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        design: [multi, sys, sys-m, core-m]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install yowasp-yosys==0.70.0.0.post1259 yowasp-runtime==1.96 # pinned (the last green version): a new release must not block a deploy
      - run: npx vite-node scripts/verify-export.ts ${{ matrix.design }}
  # the sandbox's File > Export Verilog for FPGA on its examples, through Yosys's Gowin synthesis (Tang Nano 9K)
  fpga:
    needs: changes
    if: needs.changes.outputs.fpga == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install yowasp-yosys==0.70.0.0.post1259 yowasp-runtime==1.96 # pinned (the last green version): a new release must not block a deploy
      - run: npx vite-node scripts/fpga-export.ts counter7 computer
      # the block-RAM memories read through mem_clk against asynchronous ones, a ROM -> RAM chain, at every clk edge
      - run: CYCLES=200 npx vite-node scripts/fpga-memcheck.ts
  deploy:
    needs: [changes, test, build, verify-hdl, fpga]
    # a skipped job would otherwise skip this one too; a failed or cancelled one still stops it
    if: >-
      !cancelled() && needs.changes.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') && needs.build.result == 'success' &&
      (needs.verify-hdl.result == 'success' || needs.verify-hdl.result == 'skipped') &&
      (needs.fpga.result == 'success' || needs.fpga.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # wait up to 30 min for Pages (the default 10 min times out on a busy day: the deploy then reports a failure)
          timeout: 1800000
