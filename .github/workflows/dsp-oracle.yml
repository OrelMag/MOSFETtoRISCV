name: DSP oracle

# The signal processing level's checked-in vectors, regenerated by scipy at pinned versions and compared within a tolerance. The tests that
# read them run with everything else; this checks that the vectors are still what scipy says. Same shape as tshark.yml.
on:
  push:
    paths:
      - 'scripts/dsp/**'
      - 'tests/dsp/vectors/**'
      - '.github/workflows/dsp-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r scripts/dsp/requirements.txt
      - name: Compare
        run: python scripts/dsp/oracle.py --check
