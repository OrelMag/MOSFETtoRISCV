name: Desktop program

# Builds the portable Windows program (desktop/: the site inside Electron, one .exe, nothing to install).
# After every successful deploy of main (so the program matches the site) or by hand: the rolling prerelease
# "desktop-latest", its .exe replaced with no moment where it has none (scripts/ci/release-replace.sh).
# A pushed v* tag (e.g. v2.0.0, on a commit main deployed): a permanent release of that name, marked Latest, with the
# .exe built from the tagged commit; desktop-latest is left alone. The .exe's name carries the site's version string.

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
    branches: [main]

permissions:
  contents: write

# a newer deploy cancels an older rolling build; a tag's build has a group of its own, so no deploy cancels it
concurrency:
  group: desktop-${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  windows:
    # After a deploy: only a successful one, built from the commit it deployed (not main's head, which may have moved).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0 # the build number in the version is the commit count
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      # skipped only when no layout was ever published; any other failure stops the build (scripts/ci/fetch-layout.sh)
      - name: Add the chip layout (published by the layout workflow)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/fetch-layout.sh public/layout
      - name: Add Freedoom (Appendix B's game data, BSD licence; public/doom/, never checked in)
        run: node scripts/doom/fetch-wad.mjs --public
      - run: npm run build
      - run: npm ci
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-windows
          path: desktop/release/*.exe
      - name: The program's version (the site's string, in its file name)
        id: exe
        run: |
          set -- desktop/release/*-portable.exe
          [ $# -eq 1 ] && [ -s "$1" ] || { echo "expected one .exe, found: $*" >&2; exit 1; }
          v=$(basename "$1" -portable.exe)
          v=${v#MOSFET-to-RISCV-}
          echo "file=$1" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "built $1 (version $v) from $SHA"
      - name: Publish the rolling program (desktop-latest)
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.exe.outputs.file }}
          VERSION: ${{ steps.exe.outputs.version }}
        run: |
          bash scripts/ci/release-replace.sh desktop-latest "$SHA" true "Desktop program (Windows, portable)" \
            "One .exe, nothing to install: the whole site offline in a window of its own. Version $VERSION, built from $SHA ($GITHUB_REF_NAME). Progress and sandbox chips are kept in a MOSFET-to-RISCV-data folder next to the .exe. Unsigned: Windows SmartScreen asks once (More info → Run anyway)." \
            "$FILE"
      - name: Publish the tagged release (permanent, Latest)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.exe.outputs.file }}
          VERSION: ${{ steps.exe.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="From Switch to CPU $TAG: the site as published at https://switchtocpu.com/ (version $VERSION, commit $SHA), and the same site as a portable Windows program: one .exe, nothing to install, everything offline. Progress and sandbox chips are kept in a MOSFET-to-RISCV-data folder next to the .exe. Unsigned: Windows SmartScreen asks once (More info → Run anyway). GitHub attaches this version's source code below."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # a re-run of the same tag: the .exe replaced, the release kept
            gh release upload "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
              --title "From Switch to CPU $TAG" --notes "$notes"
          fi
