name: Desktop program

# Builds the portable Windows program (desktop/: the site inside Electron, one .exe, nothing to install)
# and publishes it as the release "desktop-latest". Run after every successful deploy of main (so the
# program matches the site), by hand, or by pushing a v* tag.

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: desktop
  cancel-in-progress: true

jobs:
  windows:
    # After a deploy: only a successful one, built from the commit it deployed (not main's head, which may have moved).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0 # the build number in the version is the commit count
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - name: Add the chip layout (published by the layout workflow, if any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public/layout
          # A relative path: GNU tar takes a drive letter ("D:") for a remote host, so the runner temp folder will not do.
          if gh release download layout-latest -p layout.tar.gz -D layout-dl --repo "$GITHUB_REPOSITORY"; then
            tar -xzf layout-dl/layout.tar.gz -C public/layout && ls public/layout
          else
            echo "no layout published yet"
          fi
      - name: Add Freedoom (Appendix B's game data, BSD licence; public/doom/, never checked in)
        run: node scripts/doom/fetch-wad.mjs --public
      - run: npm run build
      - run: npm ci
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: desktop/release/*.exe
      - name: Publish the program
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete desktop-latest --yes --cleanup-tag || true
          gh release create desktop-latest desktop/release/*.exe --target "$SHA" \
            --title "Desktop program (Windows, portable)" \
            --notes "One .exe, nothing to install: the whole site offline in a window of its own. Built from $SHA ($GITHUB_REF_NAME). Progress and sandbox chips are kept in a MOSFET-to-RISCV-data folder next to the .exe. Unsigned: Windows SmartScreen asks once (More info → Run anyway)." \
            --prerelease
